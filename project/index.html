<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Calculator</h1>
	</header>
	<main>
		<!-- INPUT CONTAINER -->
		<div class="container calcCont">
			<div class="preview">
				<h1 id="preview">0</h1>
			</div>
			<div class="calculator">
				<button class="calcButton" value="1">1</button>
				<button class="calcButton" value="2">2</button>
				<button class="calcButton" value="3">3</button>
				<button class="calcButton" value="4">4</button>
				<button class="calcButton" value="5">5</button>
				<button class="calcButton" value="6">6</button>
				<button class="calcButton" value="7">7</button>
				<button class="calcButton" value="8">8</button>
				<button class="calcButton" value="9">9</button>
				<button class="calcButton" value="0">0</button>
			</div>
			<div class="operations">
				<button class="calcButton" value="+">+</button>
				<button class="calcButton" value="-">-</button>
				<button class="calcButton" value="*">x</button>
				<button class="calcButton" value="/">/</button>
				<button id="backspace">←</button>
				<button id="calcHandler">=</button>
			</div>
		</div>
	</main>
<script src="scripts.js">
</script>
</body>
</html>
