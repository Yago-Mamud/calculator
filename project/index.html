<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Calculator</h1>
	</header>
	<main>
		<!-- INPUT CONTAINER -->
		<div class="container">
			<button class="calcButton" value="1">1</button>
			<button class="calcButton" value="2">2</button>
			<button class="calcButton" value="3">3</button>
			<button class="calcButton" value="4">4</button>
			<button class="calcButton" value="5">5</button>
			<button class="calcButton" value="6">6</button>
			<button class="calcButton" value="7">7</button>
			<button class="calcButton" value="8">8</button>
			<button class="calcButton" value="9">9</button>
			<button class="calcButton" value="+">Plus</button>
			<button class="calcButton" value="-">Minus</button>
			<button class="calcButton" value="*">Times</button>
			<button class="calcButton" value="/">Divison</button>
		</div>
		<button id="calcHandler">calculate</button>
		<!-- OUTPUT CONTAINER -->
		<div class="container" id="outputContainer">
			<h1>Output</h1>
			
		</div>
	</main>
<script src="scripts.js">
</script>
</body>
</html>
